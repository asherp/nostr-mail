name: Deploy Site

on:
  push:
    branches:
      - docs
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Checkout submodules
      env:
        GLOSSIA_DEPLOY_KEY: ${{ secrets.GLOSSIA_DEPLOY_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$GLOSSIA_DEPLOY_KEY" > ~/.ssh/glossia_key
        chmod 600 ~/.ssh/glossia_key
        printf "Host github.com\n  IdentityFile ~/.ssh/glossia_key\n  StrictHostKeyChecking no\n" > ~/.ssh/config
        git submodule update --init --recursive
        rm -f ~/.ssh/glossia_key

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install pip==24.0
        pip install mkdocs markdown-include pygments mkdocs-material

    - name: Build MkDocs into /docs subpath
      run: |
        # Build MkDocs with site_url pointing to /docs/
        mkdocs build --site-dir _site_docs

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build slide deck
      run: |
        # Slidev deck served under /slides/; --base rewrites asset URLs
        cd slides
        npm ci
        npx slidev build --base /slides/ --out dist

    - name: Assemble final site
      run: |
        mkdir -p _site/docs _site/assets
        # Landing page as root, with version placeholders substituted from tauri.conf.json
        VERSION=$(jq -r .version tauri-app/backend/tauri.conf.json)
        sed -e "s|{{VERSION_TAG}}|v${VERSION}|g" \
            -e "s|{{VERSION}}|${VERSION}|g" \
            docs/landing/index.html > _site/index.html
        # Logo assets for the landing page
        cp tauri-app/frontend/assets/nostr-mail-logo.png _site/assets/
        cp tauri-app/frontend/assets/nostr-mail-logo-white.png _site/assets/
        # MkDocs docs under /docs/
        cp -r _site_docs/* _site/docs/
        # Slidev deck under /slides/
        cp -r slides/dist _site/slides
        # NIP-05 identity: serve /.well-known/nostr.json at the apex domain.
        # .nojekyll keeps GitHub Pages from stripping the dotfile directory.
        touch _site/.nojekyll
        cp -r docs/landing/.well-known _site/.well-known
        # Preserve CNAME for custom domain
        echo "nostr-mail.com" > _site/CNAME

    - name: Deploy to GitHub Pages
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

        cd _site
        git init -b gh-pages
        git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/asherp/nostr-mail.git
        git add -A
        git commit -m "Deploy landing page + docs"
        git push --force origin gh-pages
