description: |
 
  NostrMail is an Email client that adds nostr encryption and signatures to vanilla email.
  This app is compatible with any email service (GMail, yahoo, etc) for delivery, and leverages
  the Nostr network for key discovery and management.

  Features:
  - End-to-end encryption using NIP-44 (default) and NIP-04
  - Inline signatures
  - Private contacts
  - SMTP Email Sending and IMAP Email Fetching
  - Latin and Bip39 (english) ciphertext encoding via Glossia
  - Nostr direct messages and contact management
  - Profile management
  - Cross-platform support (Windows, macOS, Linux, Android)

  ⚠️ **Notice:** We recommend generating a new keypair in the app rather than using an existing one.
  You may also want to create a fresh email account for this purpose. Any provider will do - just set up an app password and you're good to go.
  

summary: An email client providing encryption and signatures within standard email, comaptible all imap/smtp servers (gmail, yahoo, business). 
website: https://nostr-mail.com
icon: tauri-app/backend/icons/icon.png
supported_nips:
    - 'NIP-01'
    - 'NIP-02'
    - 'NIP-04'
    - 'NIP-17'
    - 'NIP-19'
    - 'NIP-44'
